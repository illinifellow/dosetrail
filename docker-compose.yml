services:
  db:
    image: postgres:17
    environment: { POSTGRES_USER: dosetrail, POSTGRES_PASSWORD: dosetrail }
    volumes: ["./server/sql:/docker-entrypoint-initdb.d", "pg:/var/lib/postgresql/data"]
  scp:
    build: server
    environment: &env
      DATABASE_URL: postgresql://dosetrail:dosetrail@db/dosetrail
      DOSETRAIL_PSEUDONYM_KEY: change-me-to-a-long-random-string
    ports: ["11112:11112"]
    depends_on: [db]
  api:
    build: server
    command: ["uvicorn", "dosetrail.api:app", "--host", "0.0.0.0"]
    environment: *env
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pg:

name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "26 4 * * 2"
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
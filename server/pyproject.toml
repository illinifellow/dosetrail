[project]
name = "dosetrail"
version = "0.4.0"
description = "Patient radiation dose registry fed by DICOM Radiation Dose Structured Reports."
requires-python = ">=3.11"
dependencies = [
  "pynetdicom>=2.1",
  "pydicom>=3.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
dosetrail-scp = "dosetrail.scp:main"

[tool.ruff]
line-length = 110
